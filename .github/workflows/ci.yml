name: AlphaBrain CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Verify Code Formatting
        run: ruff format --check .

      - name: Run Linter
        run: ruff check .

  type-check:
    name: Static Type Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-passlib types-requests types-Pillow

      - name: Run Mypy Type Check
        run: mypy alpha_core alpha_worker alpha_protocol testscript

  unit-tests:
    name: Unit & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Execute Pytest Test Suite
        env:
          ENV: "test"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ALPHA_API_TOKEN: "ci-test-api-token-with-at-least-32-characters"
          ALPHA_WORKER_TOKEN: "ci-test-worker-token-with-at-least-32-characters"
          ALPHA_SIGNING_SECRET: "ci-test-signing-secret-with-at-least-32-characters"
          WORKER_ALLOW_LOCAL_DB: "true"
          PUBLIC_BASE_URL: "http://localhost:8000"
        run: pytest -v testscript/

  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan Repository for Hardcoded Secrets
        run: |
          python -c "
          import subprocess, sys
          pattern = r'AIza[A-Za-z0-9_-]{35}|sk-[A-Za-z0-9]{32,}'
          res = subprocess.run(['git', 'grep', '-E', pattern, '--', ':(exclude)testscript/*', ':(exclude).github/*'], capture_output=True, text=True)
          if res.stdout.strip():
              print('Found unredacted secrets:', res.stdout)
              sys.exit(1)
          print('Secret scan clean.')
          "
