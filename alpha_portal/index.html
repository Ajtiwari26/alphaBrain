<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AlphaBrain Client Tracking Portal">
    <title>AlphaBrain Portal</title>
    <!-- Use Tailwind via CDN for layout, but styles/config are external -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/portal/tailwind-config.js"></script>
    <link rel="stylesheet" href="/portal/portal.css">
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-4xl w-full bg-dark p-8 rounded-2xl shadow-xl border border-gray-800">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-wide">Client Tracking Portal</h1>
            <span id="sse-status" class="px-3 py-1 bg-red-900/30 text-red-400 text-sm font-semibold rounded-full border border-red-800">
                Disconnected
            </span>
        </div>

        <div class="mb-12">
            <h2 class="text-xl font-semibold mb-6">Task Progress: <span class="text-primary" id="task-id">#tsk_pending</span></h2>
            
            <!-- Amazon-style milestone tracker -->
            <div class="flex items-center justify-between w-full" id="tracker-container">
                <div class="flex flex-col items-center">
                    <div class="step-circle" id="step-1">1</div>
                    <span class="mt-2 text-sm font-medium">Received</span>
                </div>
                <div class="step-line" id="line-1"></div>
                
                <div class="flex flex-col items-center">
                    <div class="step-circle" id="step-2">2</div>
                    <span class="mt-2 text-sm font-medium">In Progress</span>
                </div>
                <div class="step-line" id="line-2"></div>
                
                <div class="flex flex-col items-center">
                    <div class="step-circle" id="step-3">3</div>
                    <span class="mt-2 text-sm text-gray-500 font-medium">Review</span>
                </div>
                <div class="step-line" id="line-3"></div>
                
                <div class="flex flex-col items-center">
                    <div class="step-circle" id="step-4">4</div>
                    <span class="mt-2 text-sm text-gray-500 font-medium">Completed</span>
                </div>
            </div>
        </div>

        <div class="bg-darker p-4 rounded-lg border border-gray-800">
            <h3 class="text-lg font-semibold mb-3 text-gray-300">Live Telemetry (SSE Listener)</h3>
            <div id="telemetry-log" class="h-40 overflow-y-auto text-sm font-mono text-gray-400 space-y-1">
                <div>Waiting for events...</div>
            </div>
        </div>
    </div>

    <!-- External script to prevent CSP blocking -->
    <script src="/portal/portal.js"></script>
</body>
</html>
