# .pre-commit-config.yaml
# Pre-commit configuration for Alpha Brain repository.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy type check
        entry: ./.venv/bin/mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [alpha_core, alpha_worker, alpha_protocol, testscript]

      - id: pytest-quick
        name: pytest unit tests
        entry: ./.venv/bin/pytest
        language: system
        types: [python]
        pass_filenames: false
        args: [-q, testscript/]
